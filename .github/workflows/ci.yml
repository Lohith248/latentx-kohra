name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra terrain
      - name: Synthetic terrain (CI never downloads the DEM)
        run: uv run python scripts/synth_terrain.py
      - run: uv run python scripts/check_scenario.py
      - run: uv run ruff check .
      - run: uv run mypy --strict -p kohra.sim -p kohra.comms -p kohra.reports -p kohra.observe -p kohra.log
      - run: uv run mypy server/kohra
      - run: uv run pytest -q
      - name: Headless demo (bot + injects, replay)
        run: uv run python scripts/demo.py --headless --speed max
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npx playwright test
        working-directory: client

  windows:
    # Windows minutes cost more on private repos: run on demand only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra terrain
      - run: uv run python scripts/synth_terrain.py
      - run: uv run pytest -q
