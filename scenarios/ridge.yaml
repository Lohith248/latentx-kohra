  pl: "Platoon"
  bn: "Battalion HQ"
  contact: "CONTACT"
  sitrep: "SITREP"

places:
  - {id: OSPREY,   kind: ford,    name: "Ford OSPREY",   lonlat: [76.1484, 11.2392], intent: "only vehicle crossing of the river inside the box"}
  - {id: KESTREL,  kind: ridge,   name: "KESTREL Ridge", lonlat: [76.1537, 11.2666], intent: "high ground N of the ford; blocks LOS from the ford to the red assembly area near JUNIPER"}
  - {id: HERON,    kind: hill,    name: "Pt HERON",      lonlat: [76.1525, 11.2205], intent: "OP site S of the ford with a view over it"}
  - {id: TAMARIND, kind: village, name: "TAMARIND",      lonlat: [76.1400, 11.2140]}
  - {id: JUNIPER,  kind: village, name: "JUNIPER",       lonlat: [76.1585, 11.2913], intent: "red assembly area, behind KESTREL from the ford"}
  - {id: WILLOW,   kind: crossroads, name: "WILLOW X",   lonlat: [76.1350, 11.2120]}

routes:
  - id: BLUEJAY
    name: "Route BLUEJAY"
    kind: road
    points: [[76.1250, 11.2030], [76.1302, 11.2027], [76.1335, 11.2108], [76.1350, 11.2120], [76.1434, 11.2181], [76.1467, 11.2213], [76.1542, 11.2278], [76.1558, 11.2311], [76.1534, 11.2343], [76.1484, 11.2392], [76.1501, 11.2449], [76.1567, 11.2514], [76.1625, 11.2563], [76.1584, 11.2668], [76.1585, 11.2913], [76.1650, 11.3000]]

sensors:
