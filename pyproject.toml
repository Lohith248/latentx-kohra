[project]
name = "kohra"
version = "0.1.0"
description = "KOHRA: decision-making under uncertainty trainer (SIH26248, Team LatentX). M1 solo slice."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary (private; team LatentX)" }
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "websockets==15.0.1",
    "numpy==2.2.5",
    "pydantic==2.11.4",
    "pyyaml==6.0.2",
    "pyproj==3.7.1",
]

[project.optional-dependencies]
terrain = [
    "rasterio==1.4.3",
    "pillow==11.2.1",
    "pmtiles==3.4.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "mypy==1.15.0",
    "ruff==0.11.8",
    "httpx==0.28.1",
    "types-PyYAML==6.0.12.20250402",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/kohra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server", "."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["client", "data", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP038"]

[tool.mypy]
python_version = "3.12"
mypy_path = "server"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyproj.*", "rasterio.*", "pmtiles.*", "PIL.*"]
ignore_missing_imports = true
